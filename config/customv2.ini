ruleset=🎯 全球直连,[]GEOIP,CN

; --- 9. 漏网之鱼 ---
ruleset=🐟 漏网之鱼,[]FINAL


; ================= 设置分组标志位 =================

; --- [1] 基础节点池 ---
custom_proxy_group=✈️ 手动选择`select`.*
custom_proxy_group=🛩️ 手动选择备用`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🔯 故障转移`fallback`.*`https://cp.cloudflare.com/generate_204`300,,50

