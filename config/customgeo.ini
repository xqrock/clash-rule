[custom]

;设置规则标志位
[custom]

; --- 1. 基础连接与局域网 ---
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
ruleset=📢 谷歌FCM,[]GEOSITE,googlefcm
ruleset=🎯 全球直连,https://raw.githubusercontent.com/xqrock/clash-rule/main/config/direct.list
ruleset=🐱 新加坡,https://raw.githubusercontent.com/xqrock/clash-rule/main/config/sg.list
ruleset=🌸 日本,https://raw.githubusercontent.com/xqrock/clash-rule/main/config/jp.list
;ruleset=🛑 广告拦截,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising_Classical.yaml
; --- 2. 必须走代理的特定服务 (高优先级) ---
ruleset=🤖 Ai,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
ruleset=🤖 Ai,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=🤖 Ai,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=🤖 Ai,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.list
ruleset=📲 电报消息,[]GEOIP,telegram,no-resolve
ruleset=🔍 Google,[]GEOSITE,google
ruleset=🔍 Google,[]GEOIP,google,no-resolve
ruleset=📹 YouTube,[]GEOSITE,youtube
ruleset=🎼 Spotify,[]GEOSITE,spotify
ruleset=👨‍💻 GitHub,[]GEOSITE,github
; --- 3. 微软与苹果 (通常选 DIRECT，必要时切代理) ---
ruleset=Ⓜ️ 微软Bing,[]GEOSITE,bing
ruleset=Ⓜ️ 微软云盘,[]GEOSITE,onedrive
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.list
; --- 4. 金融与交易 (安全性敏感) ---
ruleset=💳️ PAYPAL,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PayPal/PayPal.list
ruleset=💰︎ Crypto,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Crypto/Crypto.list
ruleset=📈 trading,https://raw.githubusercontent.com/xqrock/clash-rule/main/config/trading.list
ruleset=🎁 tradingoutside,https://raw.githubusercontent.com/xqrock/clash-rule/main/config/trading_outside.list
ruleset=👛 Wallet,https://raw.githubusercontent.com/xqrock/clash-rule/main/config/wallet.list
; --- 5. 游戏、媒体与测速 ---
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/Game.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🎯 全球直连,[]GEOSITE,speedtest
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Speedtest/Speedtest.list
; --- 6. 大陆直连与下载 (兜底方案) ---
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Download/Download.list
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOSITE,google-cn
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve
; --- 7. 其他国外流量分类 ---
ruleset=🌎 国外流量,[]GEOSITE,geolocation-!cn
;ruleset=🌎 国外流量,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
ruleset=🌎 国外流量,https://raw.githubusercontent.com/xqrock/clash-rule/main/config/outside.list
; --- 8. 漏网之鱼 ---
ruleset=🐟 漏网之鱼,[]FINAL
;设置规则标志位

;设置分组标志位
; --- [1] 基础节点池 ---
custom_proxy_group=✈️ 手动选择`select`[]⚖️ 新加坡TUIC负载均衡`[]⚖️ 新加坡Reality负载均衡`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🔯 故障转移`fallback`.*`https://cp.cloudflare.com/generate_204`300,,50

; 1. 新加坡 + TUIC 负载均衡（必须同时包含 sg 和 tuic，不区分大小写）
custom_proxy_group=⚖️ 新加坡TUIC负载均衡`load-balance`(?=.*(sg|🇸🇬))(?=.*tuic).*`https://cp.cloudflare.com/generate_204`300,,50,consistent-hashing

; 2. 新加坡 + Reality 负载均衡（必须同时包含 sg 和 reality/vless，不区分大小写）
custom_proxy_group=⚖️ 新加坡Reality负载均衡`load-balance`(?=.*(sg|🇸🇬))(?=.*Reality).*`https://cp.cloudflare.com/generate_204`300,,50,consistent-hashing

; --- [2] 核心逻辑决策组 (手动优先) ---
; 运行逻辑：只要【✈️ 手动选择】中的节点可用，就死咬不放；一旦断线，秒切【♻️ 自动选择】
custom_proxy_group=🚀 节点选择`fallback`[]✈️ 手动选择`[]♻️ 自动选择`[]🔯 故障转移`https://cp.cloudflare.com/generate_204`300

; --- [3] 核心业务分组 (对应 ruleset) ---

; AI 类：建议增加 DIRECT 选项，防止某些国内 AI 镜像走代理
custom_proxy_group=🤖 Ai`select`[]🚀 节点选择`[]✈️ 手动选择`[]DIRECT`.*

; 通讯类：电报、谷歌服务、通讯工具
custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`[]✈️ 手动选择`.*
custom_proxy_group=🔍 Google`select`[]🚀 节点选择`[]✈️ 手动选择`.*
custom_proxy_group=📢 谷歌FCM`select`[]🚀 节点选择`[]DIRECT`[]✈️ 手动选择`.*

; 媒体类：视频、音乐、GitHub
custom_proxy_group=📹 YouTube`select`[]🚀 节点选择`[]✈️ 手动选择`.*
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]✈️ 手动选择`.*
custom_proxy_group=👨‍💻 GitHub`select`[]🚀 节点选择`[]✈️ 手动选择`[]DIRECT`.*

; 微软与苹果：默认直连，可选代理
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`[]✈️ 手动选择
custom_proxy_group=Ⓜ️ 微软Bing`select`[]DIRECT`[]🚀 节点选择`[]✈️ 手动选择
custom_proxy_group=Ⓜ️ 微软云盘`select`[]DIRECT`[]🚀 节点选择`[]✈️ 手动选择
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]✈️ 手动选择
custom_proxy_group=📈 trading`select`[]DIRECT`[]🚀 节点选择`[]✈️ 手动选择

; 金融交易：安全性极高，建议手动指定稳定节点
custom_proxy_group=💳️ PAYPAL`select`[]🚀 节点选择`[]✈️ 手动选择`[]DIRECT`.*
custom_proxy_group=💰︎ Crypto`select`[]🚀 节点选择`[]✈️ 手动选择`[]DIRECT`.*
custom_proxy_group=🎼 Spotify`select`[]🚀 节点选择`[]✈️ 手动选择`[]DIRECT`.*
custom_proxy_group=🎁 tradingoutside`select`[]🚀 节点选择`[]✈️ 手动选择`[]DIRECT`.*
custom_proxy_group=👛 Wallet`select`[]🚀 节点选择`[]✈️ 手动选择`[]DIRECT`.*
custom_proxy_group=🐱 新加坡`select`[]🚀 节点选择`[]✈️ 手动选择`[]DIRECT`.*
custom_proxy_group=🌸 日本`select`[]🚀 节点选择`[]✈️ 手动选择`[]DIRECT`.*

; 游戏与基础：
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 节点选择`[]✈️ 手动选择
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]✈️ 手动选择
custom_proxy_group=🌎 国外流量`select`[]🚀 节点选择`[]✈️ 手动选择
;custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT

; 兜底分组
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]DIRECT`[]✈️ 手动选择

enable_rule_generator=true
overwrite_original_rules=true
